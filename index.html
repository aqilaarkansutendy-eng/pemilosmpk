  if (u === '/api/candidates') return CANDS.map(c => ({ ...c }));
  if (u === '/api/voter/login') { need(); sess = { voter: true, key: fdb.ref('votes').push().key }; return { ok: true }; }
  if (u === '/api/vote') {
    if (!sess.voter) throw new Error('Sesi berakhir, silakan masuk bilik lagi');
    if (!CANDS.some(c => c.id === b.candidateId)) throw new Error('Kandidat tidak valid');
    // Kunci suara dibuat sekali per sesi bilik, jadi mengirim ulang tidak bisa menghitung dobel.
    try { await Promise.race([fdb.ref('votes/' + sess.key).set(b.candidateId), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 15000))]); }
    catch (e) { throw new Error(e.message === 'timeout' ? 'Koneksi lambat. Tekan "Ya, Kirim" sekali lagi (suara tidak akan terhitung dobel).' : 'Gagal mengirim suara. Periksa koneksi internet.'); }
    sess.voter = false;
    return { receipt: rnd(), time: Date.now() };
  }
  if (u === '/api/operator/login') { need(); try { await fauth.signInWithEmailAndPassword(OP_EMAIL, b.password); } catch { throw new Error('Kode operator tidak valid'); } return { ok: true }; }
  if (u === '/api/operator/logout') { if (fauth) await fauth.signOut().catch(() => {}); return { ok: true }; }
  return { ok: true };
};
const P = 'px-6 py-3 rounded-xl bg-green-400 text-green-950 font-bold hover:bg-green-300 disabled:bg-slate-300 disabled:text-slate-500',
      S = 'px-6 py-3 rounded-xl bg-white border border-slate-300 font-semibold hover:bg-slate-100',
      I = 'w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-500 outline-none',
      CARD = 'bg-white rounded-2xl border border-slate-200 shadow-sm';
let cands = [], voter = null, sel = null, confirming = false, es = null, chart = null, log = [], rc = null;
const show = h => { app.innerHTML = h; window.scrollTo(0, 0); };
const errBox = `<p id="err" class="hidden p-3 rounded-xl bg-rose-50 text-rose-600 text-sm"></p>`;
const showErr = m => { const e = $('#err'); e.textContent = m; e.classList.remove('hidden'); };
const loadC = async () => { cands = await api('/api/candidates'); };

function home() {
  show(`<section class="text-center py-12 space-y-5">
    <p class="text-xs font-bold uppercase tracking-widest text-green-700">SMP Al-Amanah · Pemilihan Ketua OSIS 2026/2027</p>
    <h1 class="text-3xl sm:text-5xl font-extrabold">Gunakan Hak Suaramu</h1>
    <p class="text-slate-600 max-w-md mx-auto">Suara tersimpan di server dan bersifat rahasia. Bisa dipakai dari banyak perangkat.</p>
    <div class="flex gap-3 justify-center flex-wrap"><button data-act="login" class="${P}">Masuk Bilik Suara</button><button data-act="oplogin" class="${S}">Dashboard Operator</button></div>
  </section>`);
}

function loginView() {
  show(`<form data-form="login" class="${CARD} p-6 max-w-sm mx-auto space-y-4">
    <h2 class="text-xl font-bold">Masuk Pemilih</h2>
    <label class="block text-xs font-bold uppercase text-slate-600">NIS<input name="nis" required autocomplete="off" class="${I} mt-1 font-normal normal-case"></label>
    <label class="block text-xs font-bold uppercase text-slate-600">Token<input name="token" type="password" required autocomplete="off" class="${I} mt-1 font-normal"></label>
    ${errBox}<button class="${P} w-full">Verifikasi & Masuk</button></form>`);
}

function ballot() {
  show(`<h2 class="text-2xl font-bold">Pilih Pasangan Calon</h2>
  <p class="text-sm text-slate-500 mb-4">Ketuk kartu untuk memilih.</p>
  <div class="grid sm:grid-cols-3 gap-4">${cands.map(c => `
    <div data-act="pick" data-id="${c.id}" class="${CARD} p-4 cursor-pointer space-y-3 ${sel === c.id ? 'ring-2 ring-green-500 bg-green-100' : ''}">
      <b class="text-green-700 text-xs">PASLON ${esc(c.number)}</b>
      <img src="${esc(c.photo)}" alt="Foto ${esc(c.ketua)}" class="w-full aspect-[3/4] object-cover rounded-xl">
      <div><h3 class="font-bold">${esc(c.ketua)}</h3></div>
      <details class="text-xs text-slate-600"><summary class="cursor-pointer font-semibold">Visi & Misi</summary>
        <p class="mt-2">${esc(c.visi)}</p><ul class="list-disc ml-4 mt-1">${c.misi.map(m => `<li>${esc(m)}</li>`).join('')}</ul></details>
    </div>`).join('')}</div>
  <div class="mt-4 flex justify-end"><button data-act="confirm" class="${P}" ${sel ? '' : 'disabled'}>Kirim Suara Saya</button></div>
  ${confirming ? modal() : ''}`);
}

function modal() {
  const c = cands.find(x => x.id === sel);
  return `<div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4"><div class="${CARD} p-6 max-w-sm w-full space-y-4 text-center">
    <h3 class="font-bold text-lg">Konfirmasi Suara</h3>
    <p class="text-sm text-slate-600">Paslon ${esc(c.number)}: ${esc(c.ketua)}.<br>Pilihan tidak dapat diubah.</p>${errBox}
    <div class="grid grid-cols-2 gap-3"><button data-act="cancel" class="${S}">Batal</button><button data-act="send" class="${P}">Ya, Kirim</button></div></div></div>`;
}

function done(name) {
  show(`<div class="${CARD} p-6 max-w-md mx-auto text-center space-y-4">
    <div class="text-5xl">✅</div><h2 class="text-2xl font-bold">Suara Berhasil Terkirim</h2>
    <div id="rcpt" class="bg-slate-50 border border-dashed border-slate-300 rounded-xl p-4 text-left text-sm font-mono space-y-1">
      <p class="text-center font-bold">BUKTI HAK SUARA E-PILKETOS</p>
      <p>WAKTU : ${new Date(rc.time).toLocaleString('id-ID')}</p><p>KODE  : ${esc(rc.receipt)}</p>
      <p class="text-xs text-slate-500 pt-1">Kode ini tidak memuat pilihanmu.</p></div>
    <div class="grid grid-cols-2 gap-3"><button data-act="print" class="${S}">Cetak</button><button data-act="home" class="${P}">Selesai</button></div></div>`);
}

function opLogin() {
  show(`<form data-form="op" class="${CARD} p-6 max-w-sm mx-auto space-y-4"><h2 class="text-xl font-bold">Login Operator</h2>
    <input name="pw" type="password" required placeholder="Password operator" class="${I}">${errBox}<button class="${P} w-full">Buka Dashboard</button></form>`);
}

function dash() {
  show(`<div class="flex flex-wrap items-center justify-between gap-2 mb-4"><div><span class="text-xs font-bold text-emerald-600">● LIVE REALTIME</span><h2 class="text-2xl font-bold">Hasil Pemilihan</h2></div>
    <div class="flex gap-2"><button data-act="dpt" class="${S} !py-2">Atur DPT</button><button data-act="csv" class="${S} !py-2">Ekspor CSV</button><button data-act="reset" class="${S} !py-2 !text-rose-600">Reset</button><button data-act="oplogout" class="${S} !py-2">Keluar</button></div></div>
  <div class="grid grid-cols-3 gap-3 mb-4">${[['dpt', 'Total DPT'], ['vote', 'Suara Masuk'], ['pct', 'Partisipasi']].map(([i, l]) => `<div class="${CARD} p-4"><p class="text-xs text-slate-500">${l}</p><p id="s-${i}" class="text-2xl font-extrabold">0</p></div>`).join('')}</div>
  <div class="${CARD} p-4 mb-4"><div class="h-64"><canvas id="ch"></canvas></div></div>
  <div id="bars" class="${CARD} p-4 mb-4 space-y-3"></div>
  <div class="${CARD} p-4"><h3 class="text-xs font-bold uppercase text-slate-500 mb-2">Aktivitas</h3><div id="log" class="space-y-1 text-sm max-h-40 overflow-y-auto"></div></div>`);
  chart = new Chart($('#ch'), { type: 'bar',
    data: { labels: cands.map(c => 'Paslon ' + c.number), datasets: [{ data: cands.map(() => 0), backgroundColor: cands.map(c => c.color), borderRadius: 8 }] },
    options: { maintainAspectRatio: false, animation: { duration: 400 }, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
}

function upd(d) {
  const tv = d.candidates.reduce((a, c) => a + c.votes, 0);
  $('#s-dpt').textContent = d.total; $('#s-vote').textContent = d.voted;
  $('#s-pct').textContent = (d.total ? Math.round(d.voted / d.total * 100) : 0) + '%';
  chart.data.datasets[0].data = cands.map(c => c.votes); chart.update();
  $('#bars').innerHTML = cands.map(c => { const p = tv ? (c.votes / tv * 100).toFixed(1) : 0;
    return `<div><div class="flex justify-between text-xs font-bold"><span>Paslon ${esc(c.number)} · ${esc(c.ketua)}</span><span>${c.votes} (${p}%)</span></div>
    <div class="h-3 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full rounded-full transition-all duration-500" style="width:${p}%;background:${esc(c.color)}"></div></div></div>`; }).join('');
  $('#log').innerHTML = log.slice(0, 8).map(l => `<p class="text-slate-600">${esc(l)}</p>`).join('') || '<p class="text-slate-400">Menunggu suara masuk…</p>';
}

function stream() {
  if (es) es.close(); log = [];
  let total = 0, counts = {}, lastN = -1;
  const render = isVote => {
    const c = CANDS.map(x => ({ id: x.id, votes: counts[x.id] || 0 }));
    c.forEach(x => { const k = cands.find(k => k.id === x.id); if (k) k.votes = x.votes; });
    if (isVote) log.unshift(new Date().toLocaleTimeString('id-ID') + ' — 1 suara baru tercatat');
    upd({ candidates: c, total, voted: c.reduce((a, x) => a + x.votes, 0) });
  };
  const vref = fdb.ref('votes'), cref = fdb.ref('config/total');
  const onV = sn => { counts = {}; let n = 0; sn.forEach(ch => { const v = ch.val(); counts[v] = (counts[v] || 0) + 1; n++; }); const isVote = lastN >= 0 && n > lastN; lastN = n; render(isVote); };
  const onC = sn => { curTotal = total = sn.val() || 0; render(false); };
  const fail = () => { acts.home(); alert('Akses ditolak. Periksa aturan database dan akun operator di Firebase.'); };
  vref.on('value', onV, fail); cref.on('value', onC, fail);
  es = { close() { vref.off('value', onV); cref.off('value', onC); } };
}

const acts = {
  home: () => { if (es) es.close(); es = null; voter = null; sel = null; confirming = false; home(); },
  login: async () => {
    try { await api('/api/voter/login', {}); voter = { name: 'Pemilih' }; sel = null; await loadC(); ballot(); }
    catch (x) { alert(x.message); }
  },
  oplogin: opLogin,
  pick: (a, e) => { if (e.target.closest('details')) return; sel = +a.dataset.id; ballot(); },
  confirm: () => { confirming = true; ballot(); },
  cancel: () => { confirming = false; ballot(); },
  send: async () => {
    try { rc = await api('/api/vote', { candidateId: sel }); const n = voter.name; voter = null; sel = null; confirming = false; done(n); }
    catch (x) { showErr(x.message); }
  },
  print: () => window.print(),
  oplogout: async () => { await api('/api/operator/logout', {}).catch(() => {}); acts.home(); },
  csv: () => {
    const t = 'No Paslon,Nama,Jumlah Suara\n' + cands.map(c => [c.number, c.ketua, c.votes].map(v => `"${v}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' }));
    a.download = 'hasil-pilketos.csv'; a.click();
  },
};

acts.dpt = () => { const n = parseInt(prompt('Jumlah total pemilih (DPT):', curTotal)); if (n >= 0) fdb.ref('config/total').set(n).catch(() => alert('Gagal menyimpan.')); };
acts.reset = () => { if (confirm('Hapus SEMUA suara? Tidak bisa dibatalkan.') && confirm('Yakin? Hasil pemilihan akan dikosongkan.')) fdb.ref('votes').remove().catch(() => alert('Gagal mereset.')); };
document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) acts[a.dataset.act](a, e); });
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, k = f.dataset.form;
  try {
    if (k === 'login') { voter = await api('/api/voter/login', { nis: f.nis.value.trim(), token: f.token.value.trim() }); sel = null; await loadC(); ballot(); }
    if (k === 'op') { await api('/api/operator/login', { password: f.pw.value }); await loadC(); dash(); stream(); }
  } catch (x) { showErr(x.message); }
});
home();
</script>
</body>
</html>
